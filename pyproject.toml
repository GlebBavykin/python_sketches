[project]
name = "python-sketches"
version = "1.0.0"
description = "algorithms, data structures, and design patterns implemented in python3"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "pytest",
    "PyYAML",
    "faker",
    "requests",
    "pytest-xdist",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "isort",
    "mypy>=2.1.0",
    "pyright>=1.1.411",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = false


[tool.isort]
profile = "ruff"
line_length = 88


[tool.mypy]
python_version = '3.14'
strict = false
ignore_missing_imports = true
