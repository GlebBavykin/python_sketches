[project]
name = "python-sketches"
version = "1.0.0"
description = "algorithms, data structures, and design patterns implemented in python3"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "pytest",
    "PyYAML",
    "pydantic",
    "faker",
    "requests",
]

[dependency-groups]
dev = [
    "isort",
    "mypy>=2.1.0",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = false


[tool.isort]
profile = "black"
line_length = 88


[tool.mypy]
python_version = ">=3.14.5"
strict = false
ignore_missing_imports = true