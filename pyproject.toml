[project]
name = "python-sketches"
version = "1.0.0"
description = "algorithms, data structures, and design patterns implemented in python3"
readme = "README.md"
requires-python = "==3.15.*"
dependencies = [
    "pytest",
    "PyYAML==6.0.1",
    "faker",
    "requests",
    "pytest-xdist",
    "pydantic",
    "tabulate",
]

[dependency-groups]
dev = [
    "isort",
    "mypy",
    "pyright",
    "pytest",
    "pytest-xdist",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = false


[tool.isort]
profile = "ruff"
line_length = 88


[tool.mypy]
python_version = '3.14'
strict = false
ignore_missing_imports = true
