[project]
name = "python-sketches"
version = "1.0.0"
description = "algorithms, data structures, and design patterns implemented in python3"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "pytest",
    "PyYAML",
    "pydantic",
    "faker",
    "requests",
]

[dependency-groups]
dev = [
    "isort",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = false


[tool.isort]
profile = "black"
line_length = 88
