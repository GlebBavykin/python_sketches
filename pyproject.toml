[project]
name = "python-sketches"
version = "0.2.0"
description = "algorithms, data structures, and design patterns implemented in python3"
readme = "README.md"
requires-python = ">=3.14.5"
dependencies = [
    "pytest",
    "PyYAML",
    "pydantic",
    "faker",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = false
